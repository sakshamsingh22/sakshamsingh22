<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Activity Dashboard</title>
  <desc id="desc">A futuristic dark dashboard graphic celebrating consistent software engineering, building, shipping, and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#151B35"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".52" stop-color="#6366F1"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#64748B" stroke-opacity=".16" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="258" rx="21" fill="none" stroke="#475569" stroke-opacity=".65"/>
  <path d="M0 210H1200" stroke="url(#accent)" stroke-opacity=".65"/>
  <path d="M820 0L650 260M930 0L760 260M1040 0L870 260" stroke="#818CF8" stroke-opacity=".10" stroke-width="1"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="58" y="56" fill="#67E8F9" font-size="13" font-weight="700" letter-spacing="3">ENGINEERING / ACTIVITY MONITOR</text>
    <text x="58" y="118" fill="#F8FAFC" font-size="42" font-weight="800" letter-spacing=".5">BUILD. SHIP. LEARN.</text>
    <text x="60" y="155" fill="#A5B4FC" font-size="19" font-weight="500">Consistency compounds. Every commit moves the craft forward.</text>
    <rect x="60" y="184" width="10" height="10" rx="3" fill="#22D3EE" filter="url(#glow)"/>
    <text x="80" y="194" fill="#CBD5E1" font-size="12" font-weight="700" letter-spacing="2">SOFTWARE ENGINEERING</text>
    <rect x="300" y="184" width="10" height="10" rx="3" fill="#818CF8"/>
    <text x="320" y="194" fill="#CBD5E1" font-size="12" font-weight="700" letter-spacing="2">APPLIED AI</text>
    <rect x="470" y="184" width="10" height="10" rx="3" fill="#A78BFA"/>
    <text x="490" y="194" fill="#CBD5E1" font-size="12" font-weight="700" letter-spacing="2">OPEN SOURCE</text>
  </g>
  <g transform="translate(850 48)">
    <rect width="290" height="150" rx="14" fill="#0B1224" stroke="#475569" stroke-opacity=".8"/>
    <text x="20" y="28" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">DEV ACTIVITY / SIGNAL</text>
    <g transform="translate(20 48)" fill="url(#accent)">
      <rect x="0" y="54" width="12" height="24" rx="3" opacity=".45"/><rect x="20" y="40" width="12" height="38" rx="3" opacity=".55"/><rect x="40" y="26" width="12" height="52" rx="3" opacity=".72"/><rect x="60" y="34" width="12" height="44" rx="3" opacity=".65"/><rect x="80" y="12" width="12" height="66" rx="3"/><rect x="100" y="20" width="12" height="58" rx="3" opacity=".82"/><rect x="120" y="4" width="12" height="74" rx="3"/><rect x="140" y="28" width="12" height="50" rx="3" opacity=".72"/><rect x="160" y="16" width="12" height="62" rx="3" opacity=".9"/><rect x="180" y="8" width="12" height="70" rx="3"/>
    </g>
    <path d="M18 132H272" stroke="#334155"/>
    <circle cx="24" cy="132" r="3" fill="#22D3EE"/>
    <text x="36" y="136" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">LEARN / BUILD / REPEAT</text>
  </g>
  <path d="M58 232H1142" stroke="#64748B" stroke-opacity=".35" stroke-dasharray="3 7"/>
  <text x="58" y="248" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="2">SAKSHAM SINGH  ·  ENGINEERING LOG</text>
  <text x="1142" y="248" text-anchor="end" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="2">LIVE PROFILE DATA BELOW</text>
</svg>