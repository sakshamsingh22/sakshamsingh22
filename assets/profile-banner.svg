<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">Saksham Singh — Software Engineering and Applied AI</title>
<desc id="desc">Bold dark navy and indigo portfolio banner with abstract geometric network lines and a software engineering identity.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B1A"/><stop offset=".48" stop-color="#17134A"/><stop offset="1" stop-color="#312E81"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset=".52" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#6366F1" stop-opacity=".42"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#A5B4FC" stroke-opacity=".09" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1600" height="420" rx="28" fill="url(#bg)"/>
